name: Pre-CI review evidence

on:
  workflow_dispatch:
    inputs:
      service:
        description: Component under independent review
        required: true
        type: choice
        options:
          - app
          - api
      candidate_sha:
        description: Exact candidate SHA to review
        required: true
        type: string
      expected_current_sha:
        description: Exact live component SHA used for forward-only review
        required: true
        type: string

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: read-business
    permissions: {}
    env:
      BUSINESS_TOKEN: ${{ secrets.ICOM_BUSINESS_READ_TOKEN }}
      SERVICE: ${{ inputs.service }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      EXPECTED_CURRENT_SHA: ${{ inputs.expected_current_sha }}
      TARGET_REPO: icom-media/icom-business
    steps:
      - name: Independently verify exact candidate and review scope
        run: |
          set -euo pipefail
          SHA_RE='^[0-9a-f]{40}$'
          [[ "$CANDIDATE_SHA" =~ $SHA_RE ]] || { echo 'FAIL: malformed candidate SHA'; exit 1; }
          [[ "$EXPECTED_CURRENT_SHA" =~ $SHA_RE ]] || { echo 'FAIL: malformed expected-current SHA'; exit 1; }
          case "$SERVICE" in app|api) ;; *) echo 'FAIL: unsupported service'; exit 1 ;; esac
          [ -n "$BUSINESS_TOKEN" ] || { echo 'FAIL: reviewer read credential unavailable'; exit 1; }
          api() {
            curl --fail-with-body -sS --max-time 30 \
              -H "Authorization: Bearer $BUSINESS_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com$1"
          }
          mkdir -p out
          COMMIT="$(api "/repos/$TARGET_REPO/commits/$CANDIDATE_SHA")"
          [ "$(jq -r .sha <<<"$COMMIT")" = "$CANDIDATE_SHA" ] || { echo 'FAIL: candidate lookup mismatch'; exit 1; }
          COMPARE="$(api "/repos/$TARGET_REPO/compare/$EXPECTED_CURRENT_SHA...$CANDIDATE_SHA")"
          [ "$(jq -r .status <<<"$COMPARE")" = ahead ] || { echo 'FAIL: candidate is not forward-only from expected current SHA'; exit 1; }
          [ "$(jq -r .base_commit.sha <<<"$COMPARE")" = "$EXPECTED_CURRENT_SHA" ] || { echo 'FAIL: compare base mismatch'; exit 1; }
          CANDIDATE_TREE_SHA="$(jq -r .commit.tree.sha <<<"$COMMIT")"
          [[ "$CANDIDATE_TREE_SHA" =~ $SHA_RE ]] || { echo 'FAIL: candidate tree provenance unavailable'; exit 1; }
          jq -r '.files[].filename' <<<"$COMPARE" > out/files.txt
          [ -s out/files.txt ] || { echo 'FAIL: empty candidate diff'; exit 1; }
          AUTO_INVITE_SETTINGS_SCOPE=0
          MIGRATION_SHA256=''
          if [ "$SERVICE" = app ] && grep -qx 'supabase/migrations/20260917_43_affiliate_shop_settings_control.sql' out/files.txt; then
            AUTO_INVITE_SETTINGS_SCOPE=1
          fi
          while IFS= read -r path; do
            if [ "$SERVICE" = app ]; then
              if [ "$AUTO_INVITE_SETTINGS_SCOPE" = 1 ]; then
                case "$path" in
                  apps/app/app/affiliate/'(suite)'/discover/auto-invite-settings/page.tsx|\
                  apps/app/app/affiliate/'(suite)'/discover/page.tsx|\
                  apps/app/app/affiliate/AutoInviteSettings.tsx|\
                  apps/app/app/affiliate/auto-invite-settings-actions.ts|\
                  apps/app/app/affiliate/__tests__/auto-invite-settings-actions.test.ts|\
                  apps/app/app/affiliate/__tests__/auto-invite-settings-migration.test.ts|\
                  apps/app/app/affiliate/__tests__/auto-invite-settings-ui.test.tsx|\
                  supabase/migrations/20260917_43_affiliate_shop_settings_control.sql|\
                  supabase/migrations/20260917_43_affiliate_shop_settings_control_ROLLBACK.sql|\
                  supabase/migrations/20260917_43_affiliate_shop_settings_control_VERIFY.sql) ;;
                  *) echo "FAIL: out-of-scope Auto Invite settings path: $path"; exit 1 ;;
                esac
              else
                case "$path" in
                  apps/app/app/affiliate/*|apps/app/lib/affiliate/*) ;;
                  *) echo "FAIL: out-of-scope app path: $path"; exit 1 ;;
                esac
              fi
            else
              case "$path" in
                apps/api/app/cron/affiliate-creator-discovery/route.ts|\
                apps/api/lib/affiliate-creator-discovery-ingest.ts|\
                apps/api/lib/tiktok-creator-marketplace.ts|\
                apps/api/lib/__tests__/affiliate-creator-discovery-ingest.test.ts|\
                apps/api/lib/__tests__/tiktok-creator-marketplace-map-phase1.test.ts|\
                apps/api/app/cron/affiliate-creator-metric-refresh/route.ts|\
                apps/api/lib/affiliate-creator-metric-refresh.ts|\
                apps/api/lib/__tests__/affiliate-creator-metric-refresh.test.ts|\
                scripts/icom-affiliate-creator-sync.sh|\
                scripts/cron.d/icom-affiliate-creator-sync|\
                scripts/patch-cron-allowlist-affiliate-creator-sync.sh|\
                scripts/__tests__/icom-affiliate-creator-sync.test.sh|\
                supabase/migrations/20260916_41_affiliate_creator_discovery_metadata.sql|\
                supabase/migrations/20260916_41_affiliate_creator_discovery_metadata_ROLLBACK.sql|\
                supabase/migrations/20260916_41_affiliate_creator_discovery_metadata_VERIFY.sql|\
                supabase/migrations/20260916_42_affiliate_creator_sync_runs.sql|\
                supabase/migrations/20260916_42_affiliate_creator_sync_runs_ROLLBACK.sql|\
                supabase/migrations/20260916_42_affiliate_creator_sync_runs_VERIFY.sql) ;;
                *) echo "FAIL: out-of-scope api path: $path"; exit 1 ;;
              esac
            fi
          done < out/files.txt
          ADDED_SOURCE="$(jq -r '.files[] | select(.filename | test("(__tests__|\\.test\\.)") | not) | (.patch // "")' <<<"$COMPARE" | grep '^+' | grep -v '^+++' || true)"
          if [ "$SERVICE" = app ]; then
            if [ "$AUTO_INVITE_SETTINGS_SCOPE" = 1 ]; then
              api "/repos/$TARGET_REPO/contents/supabase/migrations/20260917_43_affiliate_shop_settings_control.sql?ref=$CANDIDATE_SHA" \
                | jq -r .content | tr -d '\n' | base64 -d > out/migration-43.sql
              MIGRATION_SHA256="$(sha256sum out/migration-43.sql | awk '{print $1}')"
              [ "$MIGRATION_SHA256" = f391fa4b474075ec2dab61ed3d05ebdd51e9d134643c865cbded090c1bfe735b ] \
                || { echo 'FAIL: migration 43 checksum mismatch'; exit 1; }
              if grep -Eiq 'AUTO_INVITE_SEND[[:space:]]*=|affiliate_invite_queue|affiliate_outreach_quota|sendapprovedinvites|create_target_collaboration|pg_cron|cron\.schedule|net\.|http_post|http_get' <<<"$ADDED_SOURCE"; then
                echo 'FAIL: Auto Invite SEND, queue, quota, TikTok/network, or scheduler behavior changed'
                exit 1
              fi
              GENERAL_CHECKS='["exact_sha","forward_only","auto_invite_shop_settings_ui_scope","migration_43_scope","migration_43_checksum"]'
              CRITICAL_CHECKS='["send_off_boundary","invite_creation_absent","queue_execution_absent","quota_consumption_absent","scheduler_activation_absent","unrelated_paths_rejected"]'
            else
              if grep -Eiq 'affiliate_shop_settings|AUTO_INVITE_SEND|assignee_profile_id|affiliate-sample-assign|claim_sample|release_sample' <<<"$ADDED_SOURCE"; then
                echo 'FAIL: critical boundary token changed in Affiliate UI diff'
                exit 1
              fi
              GENERAL_CHECKS='["exact_sha","forward_only","affiliate_ui_scope"]'
              CRITICAL_CHECKS='["auto_invite_boundary","flash_sale_boundary","assignment_removal_boundary"]'
            fi
          else
            # The exact path allowlist above is the primary fail-closed boundary:
            # Auto Invite SEND/configuration, backorder classification, and every
            # unrelated API or migration path are rejected before evidence exists.
            if grep -Eiq 'AUTO_INVITE_SEND[[:space:]]*=|send[_-]?invite|daily_invite_cap|backorder[_-]?classification' <<<"$ADDED_SOURCE"; then
              echo 'FAIL: forbidden Auto Invite SEND/configuration or backorder behavior in API diff'
              exit 1
            fi
            GENERAL_CHECKS='["exact_sha","forward_only","creator_discovery_phase1_api_scope","creator_intelligence_phase2_api_scope","migration_41_scope","migration_42_scope"]'
            CRITICAL_CHECKS='["auto_invite_send_unchanged","auto_invite_configuration_unchanged","backorder_classification_unchanged","unrelated_api_paths_rejected"]'
          fi
          ISSUED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          POLICY_SHA="${GITHUB_SHA}"
          GENERAL_ID="reviewer-general-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CRITICAL_ID="reviewer-critical-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          jq -S -n --arg schema icom.pre-ci-review/v1 --arg type general --arg service "$SERVICE" \
            --arg review_id "$GENERAL_ID" --arg candidate "$CANDIDATE_SHA" \
            --arg base "$EXPECTED_CURRENT_SHA" --arg reviewer icom-deploy-reviewer-ci \
            --arg policy "$POLICY_SHA" --arg issued "$ISSUED_AT" --arg repo "$TARGET_REPO" \
            --arg tree "$CANDIDATE_TREE_SHA" --arg migration_sha256 "$MIGRATION_SHA256" --argjson checks "$GENERAL_CHECKS" \
            '{schema:$schema,service:$service,review_type:$type,decision:"PASS",review_id:$review_id,source_repository:$repo,candidate_sha:$candidate,candidate_tree_sha:$tree,expected_current_sha:$base,reviewer_id:$reviewer,policy_sha:$policy,issued_at:$issued,checks:$checks} + (if $migration_sha256 == "" then {} else {migration_sha256:$migration_sha256} end)' \
            > out/general.evidence.json
          jq -S -n --arg schema icom.pre-ci-review/v1 --arg type critical --arg service "$SERVICE" \
            --arg review_id "$CRITICAL_ID" --arg candidate "$CANDIDATE_SHA" \
            --arg base "$EXPECTED_CURRENT_SHA" --arg reviewer icom-deploy-reviewer-ci \
            --arg policy "$POLICY_SHA" --arg issued "$ISSUED_AT" --arg repo "$TARGET_REPO" \
            --arg tree "$CANDIDATE_TREE_SHA" --arg migration_sha256 "$MIGRATION_SHA256" --argjson checks "$CRITICAL_CHECKS" \
            '{schema:$schema,service:$service,review_type:$type,decision:"PASS",review_id:$review_id,source_repository:$repo,candidate_sha:$candidate,candidate_tree_sha:$tree,expected_current_sha:$base,reviewer_id:$reviewer,policy_sha:$policy,issued_at:$issued,checks:$checks} + (if $migration_sha256 == "" then {} else {migration_sha256:$migration_sha256} end)' \
            > out/critical.evidence.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unsigned-pre-ci-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/*.evidence.json
          retention-days: 1
          if-no-files-found: error

  sign:
    needs: verify
    runs-on: ubuntu-latest
    environment: review
    permissions: {}
    env:
      REVIEWER_KEY: ${{ secrets.ICOM_DEPLOY_REVIEWER_SIGNING_KEY }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: unsigned-pre-ci-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: out
      - name: Sign exact evidence bytes in reviewer domain
        run: |
          set -euo pipefail
          [ -n "$REVIEWER_KEY" ] || { echo 'FAIL: reviewer signing key unavailable'; exit 1; }
          umask 077
          KEY="$RUNNER_TEMP/reviewer-key"
          printf '%s\n' "$REVIEWER_KEY" > "$KEY"
          chmod 600 "$KEY"
          ssh-keygen -Y sign -q -n icom-review-general -f "$KEY" out/general.evidence.json
          ssh-keygen -Y sign -q -n icom-review-critical -f "$KEY" out/critical.evidence.json
          mv out/general.evidence.json.sig out/general.evidence.json.reviewer.sig
          mv out/critical.evidence.json.sig out/critical.evidence.json.reviewer.sig
          shred -u "$KEY" 2>/dev/null || rm -f "$KEY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pre-ci-review-${{ inputs.candidate_sha }}
          path: out/
          retention-days: 30
          if-no-files-found: error
